[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-ai"
version = "0.1.0"
description = "Local, single-user AI-assisted security testing workflow engine: visual DAG orchestration, deterministic execution, evidence-proof findings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lattice AI Contributors" }]
keywords = ["security", "pentest", "workflow", "ai-agent", "authorized-testing", "recon", "audit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Security :: Penetration Testing",
]
dependencies = ["jsonschema>=4.18", "pyyaml>=6.0", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lattice-ai = "lattice_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lattice_ai = ["data/*", "data/wordlists/*", "web_dist/*", "web_dist/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
